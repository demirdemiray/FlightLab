[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flightlab"
version = "0.1.0"
description = "Aircraft performance analysis from aerodynamic and propulsion data"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "scipy>=1.14,<2"]

[project.scripts]
flightlab = "flightlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
